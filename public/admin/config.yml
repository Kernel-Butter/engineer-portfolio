# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
backend:
  name: github
  repo: Kernel-Butter/engineer-portfolio
  auth_methods: [token]

site_url: /
media_folder: public/uploads
public_folder: /uploads

collections:
  - name: home
    label: Home Page
    icon: home
    files:
      - name: pageLayout
        label: 00 - Page Layout
        file: src/content/page-layout.json
        format: json
        fields:
          - label: Sections
            name: sections
            widget: list
            required: false
            summary: "{{fields.section}}"
            hint: Drag items to change their order. Turn visibility off to hide a section.
            fields:
              - label: Section
                name: section
                widget: select
                required: false
                options:
                  - { label: Hero, value: hero }
                  - { label: Value Proposition, value: valueProposition }
                  - { label: Featured Projects, value: projects }
                  - { label: Technology Stack, value: techStack }
                  - { label: Career, value: career }
                  - { label: AI Workflow, value: aiWorkflow }
                  - { label: Writing, value: writing }
                  - { label: Engineering Standards, value: standards }
                  - { label: Testimonials, value: testimonials }
                  - { label: Contact, value: contact }
              - { label: Show section, name: visible, widget: boolean, required: false, default: true }

      - name: hero
        label: 01 - Hero
        file: src/content/hero.json
        format: json
        fields:
          - { label: Status eyebrow, name: eyebrow, widget: string, required: false }
          - { label: Headline main text, name: headlinePrefix, widget: string, required: false }
          - { label: Headline accent text, name: headlineAccent, widget: string, required: false }
          - { label: Introduction, name: subheadline, widget: text, required: false }
          - { label: Tagline, name: tagline, widget: string, required: false }
          - { label: Button label, name: ctaLabel, widget: string, required: false }
          - { label: Button link, name: ctaHref, widget: string, required: false }
          - { label: Role label, name: statusLabel, widget: string, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show eyebrow, name: eyebrow, widget: boolean, required: false, default: true }
              - { label: Show introduction, name: introduction, widget: boolean, required: false, default: true }
              - { label: Show tagline, name: tagline, widget: boolean, required: false, default: true }
              - { label: Show CTA button, name: cta, widget: boolean, required: false, default: true }
              - { label: Show role status, name: status, widget: boolean, required: false, default: true }

      - name: valueProposition
        label: 02 - Value Proposition
        file: src/content/value-proposition.json
        format: json
        fields:
          - { label: Section label, name: sectionLabel, widget: string, required: false }
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show header, name: header, widget: boolean, required: false, default: true }
              - { label: Show status bar, name: statusBar, widget: boolean, required: false, default: true }
          - label: Cards
            name: cards
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Show card, name: visible, widget: boolean, required: false, default: true }
              - { label: Title, name: title, widget: string, required: false }
              - { label: Points, name: points, widget: list, required: false, field: { label: Point, name: item, widget: string, required: false } }

      - name: projects
        label: 03 - Featured Projects
        file: src/content/projects.json
        format: json
        fields:
          - { label: Section label, name: sectionLabel, widget: string, required: false }
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - { label: Section introduction, name: sectionSubtitle, widget: text, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show header, name: header, widget: boolean, required: false, default: true }
              - { label: Show View All button, name: viewAll, widget: boolean, required: false, default: true }
          - label: Projects
            name: items
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: Show project, name: visible, widget: boolean, required: false, default: true }
              - { label: Name, name: name, widget: string, required: false }
              - { label: Tags, name: chips, widget: list, required: false, field: { label: Tag, name: tag, widget: string, required: false } }
              - { label: Description, name: description, widget: text, required: false }
              - { label: Category, name: category, widget: string, required: false }
              - { label: Image, name: image, widget: image, required: false }
              - { label: Image description, name: imageAlt, widget: string, required: false }
              - { label: Live website URL, name: href, widget: string, required: false }

      - name: techStack
        label: 04 - Technology Stack
        file: src/content/tech-stack.json
        format: json
        fields:
          - { label: Section label, name: sectionLabel, widget: string, required: false }
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - { label: Section introduction, name: sectionSubtitle, widget: text, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show header, name: header, widget: boolean, required: false, default: true }
              - { label: Show interactive visualization, name: visualization, widget: boolean, required: false, default: true }
              - { label: Show category list, name: categoryList, widget: boolean, required: false, default: true }
          - label: Categories
            name: categories
            widget: list
            required: false
            summary: "{{fields.label}}"
            fields:
              - { label: Show category, name: visible, widget: boolean, required: false, default: true }
              - { label: Icon, name: icon, widget: string, required: false }
              - { label: Category, name: label, widget: string, required: false }
              - { label: Technologies, name: chips, widget: list, required: false, field: { label: Technology, name: item, widget: string, required: false } }

      - name: career
        label: 05 - Career
        file: src/content/career.json
        format: json
        fields:
          - { label: Section label, name: sectionLabel, widget: string, required: false }
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - { label: Section introduction, name: sectionSubtitle, widget: text, required: false }
          - label: Roles
            name: roles
            widget: list
            required: false
            summary: "{{fields.title}} at {{fields.company}}"
            fields:
              - { label: Show role, name: visible, widget: boolean, required: false, default: true }
              - { label: Period, name: period, widget: string, required: false }
              - { label: Location, name: location, widget: string, required: false }
              - { label: Job title, name: title, widget: string, required: false }
              - { label: Company, name: company, widget: string, required: false }
              - { label: Icon, name: icon, widget: string, required: false, hint: Material Symbols icon name }
              - { label: Achievements, name: bullets, widget: list, required: false, field: { label: Achievement, name: item, widget: text, required: false } }
              - { label: Technologies, name: chips, widget: list, required: false, field: { label: Technology, name: item, widget: string, required: false } }

      - name: aiWorkflow
        label: 06 - AI Workflow
        file: src/content/ai-workflow.json
        format: json
        fields:
          - { label: Section label, name: sectionLabel, widget: string, required: false }
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - { label: Section introduction, name: sectionSubtitle, widget: text, required: false }
          - { label: Metric, name: metric, widget: string, required: false }
          - { label: Metric title, name: metricTitle, widget: string, required: false }
          - { label: Metric description, name: metricDescription, widget: text, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show header, name: header, widget: boolean, required: false, default: true }
              - { label: Show terminal, name: terminal, widget: boolean, required: false, default: true }
              - { label: Show metric card, name: metricCard, widget: boolean, required: false, default: true }

      - name: writing
        label: 07 - Writing
        file: src/content/writing.json
        format: json
        fields:
          - { label: Section label, name: sectionLabel, widget: string, required: false }
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - { label: Section introduction, name: sectionSubtitle, widget: text, required: false }
          - { label: Empty message, name: emptyMessage, widget: string, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show header, name: header, widget: boolean, required: false, default: true }
              - { label: Show empty state, name: emptyState, widget: boolean, required: false, default: true }

      - name: standards
        label: 08 - Engineering Standards
        file: src/content/standards.json
        format: json
        fields:
          - { label: Section label, name: sectionLabel, widget: string, required: false }
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - { label: Section introduction, name: sectionSubtitle, widget: text, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show header, name: header, widget: boolean, required: false, default: true }
              - { label: Show standards cards, name: standardsGrid, widget: boolean, required: false, default: true }

      - name: testimonials
        label: 09 - Testimonials
        file: src/content/testimonials.json
        format: json
        fields:
          - { label: Section title, name: sectionTitle, widget: string, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show header, name: header, widget: boolean, required: false, default: true }
              - { label: Show testimonial cards, name: testimonialGrid, widget: boolean, required: false, default: true }
          - label: Testimonials
            name: items
            widget: list
            required: false
            summary: "{{fields.name}}"
            fields:
              - { label: Show testimonial, name: visible, widget: boolean, required: false, default: true }
              - { label: Name, name: name, widget: string, required: false }
              - { label: Initials, name: initials, widget: string, required: false }
              - { label: Role and company, name: role, widget: string, required: false }
              - { label: Quote, name: quote, widget: text, required: false }
              - { label: Tags, name: tags, widget: list, required: false, field: { label: Tag, name: item, widget: string, required: false } }

      - name: contact
        label: 10 - Contact
        file: src/content/contact.json
        format: json
        fields:
          - { label: Availability badge, name: statusBadge, widget: string, required: false }
          - { label: Headline line 1, name: headlineLine1, widget: string, required: false }
          - { label: Headline line 2, name: headlineLine2, widget: string, required: false }
          - { label: Introduction, name: subheadline, widget: text, required: false }
          - { label: Help text, name: hint, widget: string, required: false }
          - { label: GitHub URL, name: githubHref, widget: string, required: false }
          - { label: LinkedIn URL, name: linkedinHref, widget: string, required: false }
          - { label: Booking title, name: bookCallTitle, widget: string, required: false }
          - { label: Booking description, name: bookCallSubtitle, widget: string, required: false }
          - { label: Booking link, name: bookCallHref, widget: string, required: false }
          - { label: Contact form title, name: formTitle, widget: string, required: false }
          - label: Visible parts
            name: visibility
            widget: object
            required: false
            fields:
              - { label: Show status badge, name: status, widget: boolean, required: false, default: true }
              - { label: Show headline, name: headline, widget: boolean, required: false, default: true }
              - { label: Show introduction, name: introduction, widget: boolean, required: false, default: true }
              - { label: Show help text, name: hint, widget: boolean, required: false, default: true }
              - { label: Show social links, name: socials, widget: boolean, required: false, default: true }
              - { label: Show booking card, name: booking, widget: boolean, required: false, default: true }
              - { label: Show contact form, name: contactForm, widget: boolean, required: false, default: true }

  - name: projectsPageSettings
    label: Projects Page Settings
    icon: tune
    files:
      - name: projectsPageSettings
        label: Header Content
        file: src/content/projects-page.json
        format: json
        fields:
          - { label: Page label, name: sectionLabel, widget: string, required: false }
          - { label: Page title, name: sectionTitle, widget: string, required: false }
          - { label: Page introduction, name: sectionSubtitle, widget: text, required: false }

  - name: projects
    label: Projects
    label_singular: Project
    icon: work
    folder: src/content/projects
    create: true
    extension: json
    format: json
    identifier_field: name
    summary: "{{order}} - {{name}}"
    slug: "{{slug}}"
    fields:
      - { label: Display order, name: order, widget: number, required: false, value_type: int, min: 1, hint: Lower numbers appear first }
      - { label: Show project, name: visible, widget: boolean, required: false, default: true }
      - { label: URL slug, name: slug, widget: string, required: false, hint: Use lowercase words separated by hyphens }
      - { label: Project name, name: name, widget: string, required: false }
      - { label: Client, name: client, widget: string, required: false }
      - { label: Category, name: category, widget: string, required: false }
      - { label: Period, name: period, widget: string, required: false }
      - { label: Project image, name: image, widget: image, required: false }
      - { label: Image description, name: imageAlt, widget: string, required: false }
      - { label: Technologies, name: tech, widget: list, required: false, field: { label: Technology, name: item, widget: string, required: false } }
      - { label: Description, name: description, widget: text, required: false }
      - { label: Highlights, name: highlights, widget: list, required: false, field: { label: Highlight, name: item, widget: text, required: false } }
      - { label: Live website URL, name: href, widget: string, required: false }
      - { label: Featured project, name: featured, widget: boolean, required: false, default: false }
      - label: Project type
        name: type
        widget: select
        required: false
        options:
          - { label: Employment, value: employment }
          - { label: Agency, value: agency }
          - { label: Personal, value: personal }
