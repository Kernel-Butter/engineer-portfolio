
<style>
  .bp-root { font-family: var(--font-sans); padding: 1.5rem 0; }
  .bp-header { margin-bottom: 2rem; }
  .bp-header h2 { font-size: 18px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 4px; }
  .bp-header p { font-size: 13px; color: var(--color-text-secondary); margin: 0; }
  .section-card { border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); background: var(--color-background-primary); margin-bottom: 12px; overflow: hidden; }
  .section-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; cursor: pointer; user-select: none; }
  .section-num { font-size: 11px; font-weight: 500; color: var(--color-text-secondary); min-width: 20px; }
  .section-name { font-size: 15px; font-weight: 500; color: var(--color-text-primary); flex: 1; }
  .badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; font-weight: 500; white-space: nowrap; }
  .badge-purple { background: #EEEDFE; color: #3C3489; }
  .badge-teal { background: #E1F5EE; color: #085041; }

  .chevron { font-size: 16px; color: var(--color-text-secondary); transition: transform 0.2s; }
  .chevron.open { transform: rotate(180deg); }
  .section-body { padding: 0 16px 16px 48px; display: none; border-top: 0.5px solid var(--color-border-tertiary); margin-top: 0; padding-top: 14px; }
  .section-body.open { display: block; }
  .meta-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .meta-box { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; }
  .meta-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .meta-val { font-size: 13px; color: var(--color-text-primary); line-height: 1.5; }
  .fx-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .fx-chip { font-size: 11px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-md); padding: 3px 9px; color: var(--color-text-secondary); }
  .client-signal { font-size: 12px; color: var(--color-text-secondary); line-height: 1.6; margin-top: 6px; }
  .divider-label { font-size: 11px; color: var(--color-text-secondary); letter-spacing: 0.06em; margin: 20px 0 10px; text-transform: uppercase; }
</style>

function badge(text, isHighlight, color) {
  return `<span class="badge badge-${color}">${isHighlight ? '✦ ' : ''}${text}</span>`;
}

function renderCard(item, i) {
  const card = document.createElement('div');
  card.className = 'section-card';

  const head = document.createElement('div');
  head.className = 'section-head';
  head.setAttribute('role','button');
  head.setAttribute('tabindex','0');

  const badgeHTML = item.tags.map(t => badge(t[0], t[1], t[2])).join('');

  head.innerHTML = `
    <span class="section-num">${item.num}</span>
    <span class="section-name">${item.name}</span>
    <div class="badge-row">${badgeHTML}</div>
    <i class="ti ti-chevron-down chevron" aria-hidden="true"></i>
  `;

  const body = document.createElement('div');
  body.className = 'section-body';
  body.innerHTML = `
    <div class="meta-row">
      <div class="meta-box">
        <div class="meta-label">Purpose</div>
        <div class="meta-val">${item.purpose}</div>
      </div>
      <div class="meta-box">
        <div class="meta-label">Message to visitor</div>
        <div class="meta-val" style="font-style:italic;color:var(--color-text-primary)">"${item.message}"</div>
      </div>
    </div>
    <div class="meta-box" style="margin-bottom:10px">
      <div class="meta-label">Why IT clients need this</div>
      <div class="meta-val">${item.clientSignal}</div>
    </div>
    <div class="divider-label">Visual effects to use</div>
    <div class="fx-row">${item.effects.map(e => `<span class="fx-chip">${e}</span>`).join('')}</div>
  `;

  head.addEventListener('click', () => {
    const isOpen = body.classList.contains('open');
    body.classList.toggle('open', !isOpen);
    head.querySelector('.chevron').classList.toggle('open', !isOpen);
  });
  head.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' ') head.click(); });

  card.appendChild(head);
  card.appendChild(body);
  return card;
}

const container = document.getElementById('sections');
data.forEach((item, i) => container.appendChild(renderCard(item, i)));
