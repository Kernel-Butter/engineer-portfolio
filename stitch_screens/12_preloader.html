<!-- Preloader Logic & Particle System -->
<script>
        document.addEventListener("DOMContentLoaded", () => {
            const preloader = document.getElementById("preloader");
            const mainContent = document.getElementById("main-content");
            const progressBar = document.getElementById("progress-bar");
            const progressPercent = document.getElementById("progress-percent");
            const statusMessage = document.getElementById("status-message");
            const terminalLogs = document.getElementById("terminal-logs");
            const loadingFile = document.getElementById("loading-file");

            // Mock File Loading Sequence
            const loadingFiles = [
                "core_modules/init.d",
                "ui_framework/bento_grid.css",
                "shaders/webgl_context.glsl",
                "assets/fonts/jetbrains_mono.woff2",
                "components/glass_cards.jsx",
                "data_layer/graph_ql_query.js",
                "establishing_secure_connection..."
            ];

            let progress = 0;
            let fileIndex = 0;

            // Simple Particle System for Background
            const canvas = document.getElementById('particle-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#c0c1ff', '#44e2cd', '#4edea3'];

            class Particle {
                constructor() {
                    this.x = Math.random() * canvas.width;
                    this.y = Math.random() * canvas.height;
                    this.size = Math.random() * 2 + 0.5;
                    this.speedX = Math.random() * 1 - 0.5;
                    this.speedY = Math.random() * -1.5 - 0.5;
                    this.color = colors[Math.floor(Math.random() * colors.length)];
                    this.alpha = Math.random() * 0.5 + 0.1;
                }
                update() {
                    this.x += this.speedX;
                    this.y += this.speedY;
                    if (this.y < 0) {
                        this.y = canvas.height;
                        this.x = Math.random() * canvas.width;
                    }
                }
                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    ctx.restore();
                }
            }

            for (let i = 0; i < 100; i++) {
                particles.push(new Particle());
            }

            function animateParticles() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                for (let i = 0; i < particles.length; i++) {
                    particles[i].update();
                    particles[i].draw();
                }
                if(progress < 100) {
                     requestAnimationFrame(animateParticles);
                }
            }
            animateParticles();

            // Log appending logic
            function addLog(text) {
                const log = document.createElement('div');
                log.textContent = `> ${text}`;
                terminalLogs.appendChild(log);
                
                // Simple scroll effect
                if(terminalLogs.children.length > 5) {
                    terminalLogs.style.transform = `translateY(-${(terminalLogs.children.length - 5) * 20}px)`;
                }
            }

            // GSAP Timeline for Loading Sequence
            const tl = gsap.timeline({
                onComplete: () => {
                    // Transition to main content
                    gsap.to(preloader, {
                        opacity: 0,
                        duration: 1.2,
                        ease: "power3.inOut",
                        onComplete: () => {
                            preloader.style.display = "none";
                            document.body.style.overflow = "auto";
                            gsap.to(mainContent, {
                                opacity: 1,
                                autoAlpha: 1,
                                duration: 1,
                                ease: "power2.out"
                            });
                        }
                    });
                }
            });

            // Simulate Loading Progress
            const loadingInterval = setInterval(() => {
                // Randomize progress jumps
                const jump = Math.random() * 5 + 1;
                progress += jump;

                if (progress >= 100) {
                    progress = 100;
                    clearInterval(loadingInterval);
                    statusMessage.textContent = "Booting Engineering Identity...";
                    statusMessage.classList.replace("text-tertiary", "text-secondary");
                    loadingFile.textContent = "SYSTEM_READY";
                } else {
                    // Update file name randomly based on progress
                    if (progress > (fileIndex + 1) * (100 / loadingFiles.length)) {
                        fileIndex++;
                        if(fileIndex < loadingFiles.length) {
                             loadingFile.textContent = loadingFiles[fileIndex];
                             addLog(`Loaded: ${loadingFiles[fileIndex -1]}`);
                        }
                    }
                }

                // Update UI
                progressBar.style.width = `${progress}%`;
                // Format to 1 decimal place with leading zero if needed
                progressPercent.textContent = `${progress < 10 ? '0' : ''}${progress.toFixed(1)}%`;

            }, 80); // Update every 80ms

            // Add some initial logs
            addLog("Initializing kernel...");
            addLog("Mounting virtual DOM...");

        });
    </script>
