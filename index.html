<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SYS.ENGINEER // PORTFOLIO</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
</head>

<body class="antialiased">

  <!-- ══ PRELOADER (static HTML — renders before JS loads) ══ -->
  <div id="preloader">
    <canvas id="particle-canvas"></canvas>
    <div class="loader-content">

      <div class="text-center mb-8">
        <h1 class="font-headline-lg text-headline-lg text-primary tracking-tighter uppercase glitch-text"
            data-text="SYS.ENGINEER">SYS.ENGINEER</h1>
        <p id="status-message" class="font-code-snippet text-code-snippet text-tertiary mt-2 tracking-widest opacity-80">
          Initializing System...
        </p>
      </div>

      <div class="w-full max-w-md">
        <div class="progress-data mb-2 text-primary font-code-snippet text-label-sm">
          <span id="loading-file">boot_sequence.sh</span>
          <span id="progress-percent">00.0%</span>
        </div>
        <div class="progress-track rounded-full">
          <div class="progress-fill rounded-full" id="progress-bar"></div>
        </div>
      </div>

      <div class="w-full max-w-md mt-6 h-32 overflow-hidden relative">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#0a0a0a] z-10 pointer-events-none"></div>
        <div id="terminal-logs" class="font-code-snippet text-label-sm text-on-surface-variant/60 flex flex-col gap-1 transition-transform duration-300"></div>
      </div>

    </div>
  </div>

  <!-- ══ MAIN CONTENT ════════════════════════════════════════ -->
  <div id="main-content">

    <!-- Nav — Alpine handles mobile menu state -->
    <nav x-data="{ open: false }"
         class="sticky top-0 z-50 backdrop-blur-xl border-b border-white/10 shadow-[0_0_20px_rgba(192,193,255,0.05)] bg-surface-dim/60">
      <div class="flex justify-between items-center px-margin-mobile md:px-margin-desktop h-20 w-full max-w-container-max mx-auto">

        <div class="font-headline-md text-headline-md font-bold tracking-tighter text-primary">
          SYS.ENGINEER
        </div>

        <!-- Desktop links -->
        <div class="hidden md:flex items-center gap-8">
          <a href="#tech-stack" class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors duration-300">STK</a>
          <a href="#projects"   class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors duration-300">PRJ</a>
          <a href="#experience" class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors duration-300">EXP</a>
          <a href="#metrics"    class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors duration-300">MET</a>
        </div>

        <div class="flex items-center gap-4">
          <div class="hidden md:flex gap-2 text-on-surface-variant">
            <button class="hover:text-secondary transition-colors duration-300">
              <span class="material-symbols-outlined">terminal</span>
            </button>
            <button class="hover:text-secondary transition-colors duration-300">
              <span class="material-symbols-outlined">code</span>
            </button>
          </div>
          <a href="#contact" class="bg-primary text-on-primary font-label-sm text-label-sm px-4 py-2 rounded uppercase hover:bg-secondary transition-colors duration-300">
            HIRE_ME
          </a>
          <!-- Mobile hamburger -->
          <button class="md:hidden text-primary" @click="open = !open">
            <span class="material-symbols-outlined" x-text="open ? 'close' : 'menu'">menu</span>
          </button>
        </div>

      </div>

      <!-- Mobile drawer -->
      <div x-show="open" x-transition class="md:hidden border-t border-white/10 bg-surface-dim/95 px-margin-mobile py-4 flex flex-col gap-4">
        <a href="#tech-stack" @click="open=false" class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors">STK</a>
        <a href="#projects"   @click="open=false" class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors">PRJ</a>
        <a href="#experience" @click="open=false" class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors">EXP</a>
        <a href="#metrics"    @click="open=false" class="text-on-surface-variant font-code-snippet text-code-snippet hover:text-secondary transition-colors">MET</a>
      </div>
    </nav>

    <!-- Sections injected here by main.js -->
    <div id="app"></div>

    <!-- Footer -->
    <footer class="bg-surface-container-lowest border-t border-outline-variant/20 py-12">
      <div class="flex flex-col md:flex-row justify-between items-center px-margin-mobile md:px-margin-desktop w-full max-w-container-max mx-auto gap-gutter">
        <div class="font-headline-md text-headline-md text-primary font-bold tracking-tighter">
          TERMINAL_VELOCITY.ENGINEER
        </div>
        <div class="font-code-snippet text-code-snippet text-on-surface-variant opacity-60 text-center">
          ©2025 TERMINAL_VELOCITY.ENGINEER // STATUS: AVAILABLE_FOR_WORK
        </div>
        <nav class="flex flex-wrap justify-center gap-6">
          <a href="#" class="font-code-snippet text-code-snippet text-on-surface-variant hover:text-primary underline underline-offset-4 transition-colors">GITHUB</a>
          <a href="#" class="font-code-snippet text-code-snippet text-on-surface-variant hover:text-primary underline underline-offset-4 transition-colors">LINKEDIN</a>
          <a href="#" class="font-code-snippet text-code-snippet text-on-surface-variant hover:text-primary underline underline-offset-4 transition-colors">CV_DL</a>
        </nav>
      </div>
    </footer>

  </div><!-- /#main-content -->

  <script type="module" src="/js/main.js"></script>
</body>
</html>
